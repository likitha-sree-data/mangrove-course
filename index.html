/* ---------- Design tokens ----------
   Brand colors are measured from the Worldview Development USA logo:
   green #4DB749, blue #0054A5, light blue #00BEF2. Navy is the text color. */
:root {
  --navy: #0a2342; --blue: #0054a5; --cyan: #00bef2; --green: #4db749;

  --bg: #f1f7fc; --surface: #ffffff; --ink: #0a2342; --muted: #4b6079; --line: rgba(10,35,66,.16);
  --action: #0054a5; --action-ink: #ffffff; --action-hover: #00417f;
  --accent: #4db749; --accent-ink: #0a2342; --accent-hover: #6cc968;
  --mid: #0054a5;
  --deep: #0a2342; --deep-ink: #eaf3fb; --deep-muted: #a9bed6; --deep-line: rgba(234,243,251,.22);
  --good: #1d7a37; --good-bg: #e1f3e5; --bad: #9b3a22; --bad-bg: #f8e6df;
  --focus: #0b6fd6;
  --sky-top: #cfe8f7; --sky-bot: #eef7fc; --hill: #a5d3b4;
  --shadow: 0 1px 2px rgba(10,35,66,.08), 0 8px 24px -8px rgba(10,35,66,.18);

  --display: "Figtree", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --text: "Literata", Charter, "Iowan Old Style", Georgia, serif;
  --r: 10px;
  --wrap: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #061a33; --surface: #0c2749; --ink: #e8f2fc; --muted: #a2b8d1; --line: rgba(232,242,252,.2);
    --action: #4cc9f5; --action-ink: #04213f; --action-hover: #7dd8f8;
    --accent: #5cc65a; --accent-ink: #05203a; --accent-hover: #86d984;
    --mid: #1769b8;
    --deep: #030f20; --deep-ink: #e8f2fc; --deep-muted: #98b0cb; --deep-line: rgba(232,242,252,.2);
    --good: #86dc9a; --good-bg: #0f2f1d; --bad: #f2a58f; --bad-bg: #3a1d16;
    --focus: #7fc4f7;
    --sky-top: #0c2a4d; --sky-bot: #123a63; --hill: #1f4f4a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }
  .art svg, .hero-art svg { filter: brightness(.88) saturate(.92); }
  .cloud { display: none; }
  .rays { filter: opacity(.45); }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 18px/1.65 var(--text); }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
h1:focus, h2:focus { outline: none; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar::before { content: ""; display: block; height: 4px; background: linear-gradient(90deg, var(--green) 0 34%, var(--blue) 34% 67%, var(--cyan) 67% 100%); }
.topbar .wrap { display: flex; align-items: center; gap: 18px; height: 72px; }
.logo { display: block; flex: none; border-radius: 6px; line-height: 0; }
.logo img { height: 44px; width: auto; display: block; }
.topbar .sep { width: 1px; height: 34px; background: var(--line); flex: none; }
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); text-align: left; min-width: 0; }
.brand b { font: 700 21px/1 var(--display); letter-spacing: -0.015em; }
.brand small { font: 500 13px/1 var(--display); color: var(--muted); letter-spacing: .01em; }
.topbar .grow { flex: 1; }
.topbar .step { font: 500 15px/1 var(--display); color: var(--muted); }
.sitelink { flex: none; font: 600 15px/1 var(--display); color: var(--action); text-decoration: none; padding: 11px 16px; border: 1.5px solid var(--line); border-radius: 8px; transition: border-color .15s, background .15s; }
.sitelink:hover { border-color: var(--action); background: color-mix(in srgb, var(--action) 8%, transparent); }
@media (prefers-color-scheme: dark) { .logo { background: #fff; padding: 4px 7px; border-radius: 8px; } .logo img { height: 36px; } }

/* ---------- Buttons ---------- */
.btn { box-shadow: 0 1px 0 rgba(10,35,66,.12); display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: var(--r); border: 2px solid var(--action); background: var(--action); color: var(--action-ink); font: 600 17px/1 var(--display); cursor: pointer; transition: background .15s, transform .15s; }
.btn:hover { background: var(--action-hover); border-color: var(--action-hover); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); background: transparent; }
.btn.on-deep { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on-deep:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.sm { min-height: 44px; padding: 0 18px; font-size: 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--action); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.deep .linkbtn { color: var(--accent); }

/* ---------- Home: the cross-section ---------- */
.hero { position: relative; overflow: hidden; background: var(--sky-top); min-height: clamp(560px, 52.8vw, 760px); }
.hero-art { position: absolute; inset: 0; margin-bottom: -1px; }
.hero-art svg { width: 100%; height: 100%; display: block; }
.hero-copy { position: relative; padding: clamp(64px, 8vw, 104px) 0 48px; max-width: 620px; }
.hero h1 { font-size: clamp(2.5rem, 5.2vw, 4.4rem); font-weight: 700; line-height: 1.02; letter-spacing: -0.03em; }
.lede { margin-top: 22px; font-size: clamp(1.1rem, 2vw, 1.3rem); line-height: 1.6; max-width: 32em; }
.cta-row { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; }
.cta-row .meta { color: var(--ink); font-size: 16px; }
@media (max-width: 1099px) {
  .hero { display: flex; flex-direction: column; min-height: 0; }
  .hero > .wrap { order: 1; width: 100%; }
  .hero-copy { padding: 44px 0 28px; max-width: 34em; }
  .hero-art { order: 2; position: relative; inset: auto; height: clamp(300px, 78vw, 520px); }
}
.drift { animation: drift 7s linear infinite; }
@keyframes drift { to { transform: translateX(-120px); } }

.deep { position: relative; background: var(--deep); color: var(--deep-ink); padding: 8px 0 72px; }
.deep h2 { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 650; }
.deep .sub { margin-top: 10px; color: var(--deep-muted); max-width: 36em; }
.rail { list-style: none; margin: 44px 0 0; padding: 0; position: relative; }
.row::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 2px; background: var(--deep-line); }
.row:first-child::before { top: 42px; }
.row:last-child::before { bottom: auto; height: 42px; }
.row { position: relative; display: grid; grid-template-columns: 44px 1fr auto; gap: 8px 22px; align-items: start; padding: 20px 0; border-bottom: 1px solid var(--deep-line); }
.row:last-child { border-bottom: 0; }
.node { position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--deep-muted); background: var(--deep); display: grid; place-items: center; font: 700 18px/1 var(--display); color: var(--deep-ink); }
.row.ready .node { border-color: var(--accent); color: var(--accent); }
.row.done .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row h3 { font-size: 1.35rem; font-weight: 650; line-height: 1.25; padding-top: 6px; }
.row .q { margin-top: 4px; color: var(--deep-muted); font-size: 17px; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding-top: 4px; text-align: right; }
.row-side .time { font: 500 15px/1 var(--display); color: var(--deep-muted); }
.row.locked h3 { color: var(--deep-muted); }
.row .soon { font: 500 15px/1 var(--display); color: var(--deep-muted); border: 1px solid var(--deep-line); border-radius: 99px; padding: 7px 12px; }
.cert { margin-top: 28px; padding: 18px 20px; border: 1px dashed var(--deep-line); border-radius: var(--r); color: var(--deep-muted); max-width: 44em; }
/* ---------- About band and footer ---------- */
.about { background: var(--surface); padding: 72px 0; border-top: 1px solid var(--line); }
.about-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.about h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; line-height: 1.15; }
.about p { margin-top: 16px; max-width: 34em; font-size: 1.1rem; line-height: 1.7; }
.about .btn { margin-top: 26px; text-decoration: none; }
.about-mark { margin: 0; display: grid; place-items: center; padding: 36px; border-radius: 16px; background: linear-gradient(160deg, color-mix(in srgb, var(--cyan) 14%, var(--surface)), color-mix(in srgb, var(--green) 14%, var(--surface))); border: 1px solid var(--line); }
.about-mark img { width: min(100%, 250px); height: auto; display: block; }
.foot { background: var(--deep); color: var(--deep-ink); padding: 52px 0 40px; border-top: 4px solid var(--accent); font-size: 15px; line-height: 1.6; }
.foot-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 36px 48px; }
.foot .chip { display: inline-block; background: #fff; border-radius: 10px; padding: 8px 12px; line-height: 0; }
.foot .chip img { height: 46px; width: auto; display: block; }
.foot h2 { font: 700 17px/1.3 var(--display); margin: 14px 0 6px; letter-spacing: 0; }
.foot h3 { font: 700 15px/1.3 var(--display); margin: 0 0 8px; letter-spacing: 0; }
.foot p { margin: 0; color: var(--deep-muted); }
.foot p + p { margin-top: 8px; }
.foot address { font-style: normal; color: var(--deep-muted); }
.foot .linkbtn { color: var(--deep-ink); }
.foot a { color: var(--deep-ink); text-underline-offset: 3px; }
.foot a:hover { color: var(--accent); }
.foot .legal { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--deep-line); color: var(--deep-muted); font-size: 14px; }
@media (max-width: 860px) {
  .about { padding: 48px 0; }
  .about-grid { grid-template-columns: 1fr; gap: 28px; }
  .about-mark { padding: 28px; order: -1; }
  .about-mark img { width: 160px; }
  .foot-grid { grid-template-columns: 1fr; gap: 28px; }
}

/* ---------- Lesson and quiz layout ---------- */
.stage { padding-top: 20px; padding-bottom: 72px; }
.crumb { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 500 15px/1.3 var(--display); color: var(--muted); margin-bottom: 22px; }
.grid { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 28px; align-items: start; }
.main { max-width: 800px; }

/* the tide gauge */
.gauge { position: sticky; top: 92px; display: flex; gap: 12px; height: min(64vh, 460px); }
.tube { width: 24px; border: 2px solid var(--ink); border-radius: 14px; background: var(--surface); position: relative; overflow: hidden; flex: none; }
.water { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--p) * 100%); background: linear-gradient(180deg, var(--cyan), var(--blue)); border-top: 4px solid var(--accent); transition: height .8s cubic-bezier(.25,.8,.25,1); }
.ticks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; justify-content: space-between; }
.ticks li { display: flex; }
.ticks button, .ticks span { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font: 600 15px/1 var(--display); color: var(--muted); cursor: default; padding: 0; }
.ticks button { cursor: pointer; }
.ticks button:hover { border-color: var(--ink); color: var(--ink); }
.ticks .on span, .ticks .on button { background: var(--mid); border-color: var(--mid); color: #fff; }
.ticks .now span, .ticks .now button { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.ticks .right span { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.ticks .wrong span { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

.art { box-shadow: var(--shadow); border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 10; background: var(--sky-bot); border: 1px solid var(--line); }
.art svg { width: 100%; height: 100%; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding: 0; list-style: none; }
.chips li { border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: 500 15px/1.3 var(--display); background: var(--surface); }
.chips b { color: var(--action); margin-right: 6px; }

.lesson-title { margin-top: 28px; font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 650; line-height: 1.1; letter-spacing: -0.025em; }
.lead-q { margin-top: 10px; font-style: italic; color: var(--muted); font-size: 1.15rem; }
.body { margin-top: 18px; font-size: clamp(1.15rem, 2.2vw, 1.3rem); line-height: 1.7; max-width: 33em; }
.term { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; border-bottom: 2px dotted var(--action); }
.term:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.def { min-height: 1.7em; margin-top: 12px; max-width: 33em; color: var(--muted); font-size: 1rem; }
.def strong { color: var(--ink); font-family: var(--display); }
.deeper { margin-top: 22px; max-width: 33em; font-size: 16px; color: var(--muted); line-height: 1.55; }
.deeper a { color: var(--action); font-weight: 600; text-underline-offset: 3px; }
.outlink { margin-top: 22px; }
a.btn { text-decoration: none; }
.nav { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }

/* quiz */
.qcount { font: 500 16px/1 var(--display); color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 14px 0 0; min-width: 0; }
legend { padding: 0; font: 600 clamp(1.35rem, 2.8vw, 1.75rem)/1.3 var(--display); letter-spacing: -0.015em; margin-bottom: 18px; max-width: 28em; }
.opt { position: relative; margin-bottom: 10px; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt label { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: start; padding: 14px 16px; border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; transition: border-color .12s, background .12s; line-height: 1.5; }
.opt label:hover { border-color: var(--ink); }
.opt .ltr { width: 36px; height: 36px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font: 700 16px/1 var(--display); color: var(--muted); }
.opt input:checked + label { border-color: var(--action); background: color-mix(in srgb, var(--action) 9%, var(--surface)); }
.opt input:checked + label .ltr { background: var(--action); border-color: var(--action); color: var(--action-ink); }
.opt input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 3px; }
.opt input:disabled + label { cursor: default; }
.opt.correct input + label, .opt.correct input:checked + label { border-color: var(--good); background: var(--good-bg); }
.opt.correct input + label .ltr, .opt.correct input:checked + label .ltr { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.wrong input + label, .opt.wrong input:checked + label { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong input + label .ltr, .opt.wrong input:checked + label .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.tag { display: block; font: 700 14px/1.2 var(--display); margin-bottom: 3px; }
.opt.correct .tag { color: var(--good); }
.opt.wrong .tag { color: var(--bad); }
.feedback { margin-top: 18px; padding: 16px 18px; border-left: 5px solid; border-radius: 0 var(--r) var(--r) 0; max-width: 40em; }
.feedback.good { border-color: var(--good); background: var(--good-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback strong { font: 700 18px/1.3 var(--display); }
.feedback p { margin-top: 6px; }
.feedback p + p { margin-top: 10px; }

/* result */
.score { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.ring { width: 150px; height: 150px; flex: none; }
.ring circle { fill: none; stroke-width: 12; }
.ring .track { stroke: var(--line); }
.ring .val { stroke: var(--good); stroke-linecap: round; transition: stroke-dasharray 1s cubic-bezier(.25,.8,.25,1); transform: rotate(-90deg); transform-origin: 70px 70px; }
.ring text { font: 700 42px/1 var(--display); fill: var(--ink); }
.ring .of { font-size: 15px; font-weight: 500; fill: var(--muted); }
.result-h { font-size: clamp(1.9rem, 4vw, 2.7rem); font-weight: 650; line-height: 1.1; }
.result-p { margin-top: 10px; max-width: 28em; }
.review { list-style: none; padding: 0; margin: 28px 0 0; max-width: 40em; border-top: 1px solid var(--line); }
.review li { display: grid; grid-template-columns: 34px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 17px; line-height: 1.45; }
.review .mk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--display); }
.review .mk.right { background: var(--good-bg); color: var(--good); border: 2px solid var(--good); }
.review .mk.wrong { background: var(--bad-bg); color: var(--bad); border: 2px solid var(--bad); }

/* ---------- Reviewer view ---------- */
.rv { max-width: 980px; }
.rv .lead-q { margin-bottom: 16px; }
.rv-jump { position: sticky; top: 72px; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; margin: 14px 0 6px; background: var(--bg); }
.rv-jump a { font: 600 15px/1 var(--display); color: var(--action); text-decoration: none; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
.rv-jump a:hover { border-color: var(--action); }
.rv-mod { margin-top: 44px; scroll-margin-top: 130px; }
.rv-mod h3 { font-size: 1.7rem; font-weight: 700; padding-bottom: 8px; border-bottom: 3px solid var(--accent); }
.rv-sub { font: 700 1.05rem/1.2 var(--display); margin: 26px 0 10px; color: var(--muted); }
.rv-screen { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: start; }
.rv-art { aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.rv-art svg { width: 100%; height: 100%; display: block; }
.rv-screen h4 { font: 700 1.2rem/1.25 var(--display); margin: 0 0 6px; }
.rv-screen h4 span { color: var(--action); margin-right: 6px; }
.rv-screen p { margin: 0 0 8px; font-size: 1rem; line-height: 1.6; }
.rv-lead { font-style: italic; color: var(--muted); }
.rv-meta { font-size: 14px; color: var(--muted); line-height: 1.5; }
.rv-screen .rv-meta { font-size: 14px; }
.rv-qs { padding: 0; list-style: none; margin: 0; counter-reset: q; }
.rv-q { counter-increment: q; padding: 16px 0; border-bottom: 1px solid var(--line); }
.rv-qtext { font: 600 1.1rem/1.4 var(--display); margin: 0 0 8px; }
.rv-qtext::before { content: counter(q) ". "; color: var(--action); }
.rv-q ol { margin: 0 0 8px; padding-left: 26px; }
.rv-q ol li { padding: 3px 8px; font-size: 1rem; line-height: 1.5; border-radius: 6px; }
.rv-q ol li.ok { background: var(--good-bg); color: var(--ink); }
.rv-q ol li b { color: var(--good); font: 700 13px/1 var(--display); margin-left: 6px; }
@media (max-width: 860px) { .rv-screen { grid-template-columns: 1fr; gap: 12px; } .rv-art { max-width: 420px; } .rv-jump { top: 64px; } }
@media print {
  .topbar, .rv-jump, .crumb, .rv .btn { display: none !important; }
  body { background: #fff; font-size: 12pt; }
  .rv-screen, .rv-q { break-inside: avoid; }
  .rv-mod { break-before: page; }
}

/* ---------- Scene motion (slow, decorative) ---------- */
.rays { animation: shimmer 9s ease-in-out infinite alternate; }
@keyframes shimmer { from { opacity: .55; } to { opacity: 1; } }
.cloud { animation: cloud 70s ease-in-out infinite alternate; }
@keyframes cloud { to { transform: translateX(90px); } }
.tw { animation: twinkle 4s ease-in-out infinite; }
.tw1 { animation-delay: -1s; } .tw2 { animation-delay: -2s; } .tw3 { animation-delay: -3s; }
@keyframes twinkle { 50% { opacity: .05; } }
.swim { animation: swim 26s ease-in-out infinite alternate; }
.swim1 { animation-duration: 34s; animation-delay: -8s; } .swim2 { animation-duration: 40s; animation-delay: -15s; }
@keyframes swim { to { transform: translateX(260px); } }

/* ---------- Ambient motion ---------- */
.sunglow { animation: sunpulse 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes sunpulse { from { transform: scale(.92); opacity: .75; } to { transform: scale(1.12); opacity: 1; } }
.sunrays { animation: spin 90s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.fly { animation: fly linear infinite; }
@keyframes fly { from { transform: translate(-100px, 0); } to { transform: translate(var(--dx), -14px); } }
.swimL { animation: swimL linear infinite; }
@keyframes swimL { from { transform: translateX(var(--sx)); } to { transform: translateX(-140px); } }
.bob { animation: bob 2.4s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(7px); } }

.glide { animation: glide 3.2s ease-in-out infinite alternate; }
@keyframes glide { to { transform: translateY(9px); } }
.wing { transform-box: fill-box; animation: flap 1.1s ease-in-out infinite alternate; }
.wingL { transform-origin: 100% 85%; } .wingR { transform-origin: 0% 85%; }
@keyframes flap { from { transform: rotate(calc(var(--s) * -6deg)); } to { transform: rotate(calc(var(--s) * 10deg)); } }

/* ---------- Label hover text ---------- */
.chips li.has-tip { padding: 0; }
.chip { display: inline-flex; align-items: center; gap: 0; padding: 6px 10px 6px 12px; background: none; border: 0; border-radius: 6px; font: inherit; color: inherit; cursor: help; text-align: left; }
.chip:hover { background: color-mix(in srgb, var(--action) 8%, transparent); }
.chip .i { flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 8px; border-radius: 50%; border: 1.5px solid var(--action); color: var(--action); font: 700 11px/1 var(--display); font-style: italic; }
.chip[aria-expanded="true"] { background: color-mix(in srgb, var(--action) 12%, transparent); }
.tiphint { margin: 8px 0 0; font: 500 14px/1.4 var(--display); color: var(--muted); }
#tip { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 10px; background: var(--navy); color: #eaf3fb; font: 400 15px/1.5 var(--text); box-shadow: 0 10px 30px -8px rgba(0,0,0,.45); pointer-events: none; }
#tip[hidden] { display: none; }
@media (prefers-color-scheme: dark) { #tip { background: #0f3a66; border: 1px solid rgba(232,242,252,.25); } }
.rv-tips { margin: 6px 0 0; padding-left: 20px; }

/* ---------- Chart and scene animation ---------- */
.gx { transform-box: fill-box; transform-origin: 0 50%; animation: growx 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes growx { from { transform: scaleX(0); } }
.fi { animation: fadein .8s ease both; animation-delay: var(--d, 0s); }
@keyframes fadein { from { opacity: 0; } }
.pop { transform-box: fill-box; transform-origin: center; animation: popin .55s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0s); }
@keyframes popin { from { transform: scale(.3); opacity: 0; } }
.pulse { animation: pulseo 1.5s ease-in-out infinite alternate; }
@keyframes pulseo { from { opacity: .7; } }
.warmband { animation: warmpulse 5s ease-in-out infinite alternate; }
@keyframes warmpulse { from { opacity: .12; } to { opacity: .3; } }
.flowline { animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -26; } }
.nudge { animation: nudge 1.3s ease-in-out infinite alternate; }
@keyframes nudge { to { transform: translateX(8px); } }
.bobx { animation: bobx 2.8s ease-in-out infinite alternate; }
@keyframes bobx { to { transform: translateY(-6px); } }
.growup { transform-box: fill-box; transform-origin: 50% 100%; animation: growup 8s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes growup { 0% { transform: scale(.3); opacity: 0; } 10% { opacity: 1; } 55%, 88% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
.spin2 { animation: spin 3.5s linear infinite; }
.tidecycle { animation: tidecycle 8s ease-in-out infinite; }
@keyframes tidecycle { 0%, 100% { opacity: 0; } 35%, 65% { opacity: .65; } }
.tideswing { animation: tideswing 7s ease-in-out infinite alternate; }
@keyframes tideswing { from { transform: translateY(14px); } to { transform: translateY(-12px); } }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
.wave { animation: flagwave 1.2s ease-in-out infinite alternate; }
@keyframes flagwave { from { transform: skewY(-6deg) scaleX(1); } to { transform: skewY(6deg) scaleX(.9); } }
.twinkle { animation: twinkle2 2.2s ease-in-out infinite; }
@keyframes twinkle2 { 50% { opacity: .1; } }
.travel { animation: travel 9s linear infinite; }
@keyframes travel { from { transform: translateX(0); } to { transform: translateX(var(--tx)); } }
.bubble { animation: rise 4s linear infinite; }
@keyframes rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-46px); opacity: 0; } }
.seeddrift { animation: seeddrift 6s ease-out infinite; animation-delay: var(--d, 0s); }
@keyframes seeddrift { 0% { transform: translateX(-70px); opacity: 0; } 25% { opacity: 1; } 70%, 100% { transform: translateX(0); opacity: 1; } }
.blocked { animation: blocked 3.2s ease-in infinite; }
@keyframes blocked { 0% { transform: translateX(-30px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateX(34px); opacity: 1; } 100% { transform: translateX(34px); opacity: 0; } }
.tidebig { animation: tidebig 7s ease-in-out infinite alternate; }
@keyframes tidebig { from { transform: translateY(40px); } to { transform: translateY(-42px); } }
.tidesmall { animation: tidesmall 7s ease-in-out infinite alternate; }
@keyframes tidesmall { from { transform: translateY(5px); } to { transform: translateY(-5px); } }
.trash { animation: trash 9s linear infinite; }
@keyframes trash { from { transform: translateX(0); } to { transform: translateX(300px); } }
.say { transform-box: fill-box; transform-origin: 50% 100%; animation: say 6s ease-in-out infinite; animation-delay: var(--d, 0s); opacity: 0; }
@keyframes say { 0% { opacity: 0; transform: scale(.4); } 8% { opacity: 1; transform: scale(1.06); } 14%, 55% { opacity: 1; transform: scale(1); } 66%, 100% { opacity: 0; transform: scale(.9); } }
.tick { transform-box: fill-box; transform-origin: center; animation: popin .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0s); }

/* ---------- Clickable numbers inside pictures ---------- */
.hot { cursor: pointer; outline: none; }
.hot .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
.hot .hotface { transform-box: fill-box; transform-origin: center; transition: transform .15s; }
.hot:hover .hotface, .hot:focus-visible .hotface, .hot.on .hotface { transform: scale(1.18); }
.hot:focus-visible .hotface circle { stroke: var(--focus); stroke-width: 5; }
.waving { animation: waving 1s ease-in-out infinite alternate; }
@keyframes waving { from { transform: rotate(-22deg); } to { transform: rotate(18deg); } }

/* ---------- Facts band and map band ---------- */
.facts { list-style: none; margin: 0; padding: 40px 0 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.facts li { padding: 22px 22px 20px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--deep-line); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.facts strong { display: block; font: 800 clamp(2rem, 4vw, 2.9rem)/1 var(--display); letter-spacing: -0.03em; color: var(--accent); }
.facts span { display: block; margin-top: 10px; font-size: 16px; line-height: 1.5; color: var(--deep-ink); }
.statsrc { margin-top: 14px; font-size: 14px; color: var(--deep-muted); }
.deep .facts + .statsrc + h2 { margin-top: 56px; }
.mapband { background: linear-gradient(135deg, var(--blue) 0%, #003d7a 100%); color: #fff; padding: 64px 0; }
.mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.mapband h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; line-height: 1.15; }
.mapband p { margin-top: 14px; font-size: 1.1rem; line-height: 1.7; max-width: 32em; color: #e3effa; }
.mapband .btn { margin-top: 24px; background: #fff; border-color: #fff; color: var(--navy); text-decoration: none; }
.mapband .btn:hover { background: var(--green); border-color: var(--green); }
.mapart { border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; box-shadow: 0 18px 40px -16px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25); }
.mapart svg { width: 100%; height: 100%; display: block; }
.crumb .gmw { margin-left: auto; font-weight: 600; color: var(--action); text-underline-offset: 3px; }
@media (max-width: 860px) {
  .facts { grid-template-columns: 1fr; padding-top: 28px; }
  .mapgrid { grid-template-columns: 1fr; gap: 28px; }
  .mapband { padding: 48px 0; }
  .crumb .gmw { margin-left: 0; flex-basis: 100%; }
}

/* ---------- Small screens: the gauge lies down ---------- */
@media (max-width: 860px) {
  body { font-size: 17px; }
  .topbar .wrap { height: 64px; gap: 12px; }
  .logo img { height: 36px; }
  .brand b { font-size: 18px; }
  .brand small { font-size: 12px; }
  .topbar .step, .sitelink { display: none; }
  .grid { grid-template-columns: 1fr; gap: 20px; }
  .gauge { position: static; height: auto; flex-direction: column; gap: 10px; }
  .tube { width: 100%; height: 14px; }
  .water { right: auto; top: 0; height: 100%; width: calc(var(--p) * 100%); background: linear-gradient(90deg, var(--cyan), var(--blue)); border-top: 0; border-right: 4px solid var(--accent); transition: width .8s cubic-bezier(.25,.8,.25,1); }
  .ticks { flex-direction: row; justify-content: space-between; }
  .ticks button, .ticks span { width: 36px; height: 36px; }
  .hero-copy { padding-bottom: 20px; }
  .row { grid-template-columns: 44px 1fr; }
  .row-side { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; text-align: left; padding-top: 6px; gap: 14px; }
  .rail::before { left: 21px; }
  .nav .btn { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .drift, .rays, .cloud, .tw, .sunglow, .sunrays, .fly, .swimL, .bob, .glide, .wing, .gx, .fi, .pop, .pulse, .warmband, .flowline, .nudge, .bobx, .growup, .spin, .spin2, .tidecycle, .tideswing, .tidebig, .tidesmall, .trash, .say, .waving, .hot .ping, .sway, .wave, .twinkle, .travel, .bubble, .seeddrift, .blocked, .tick { animation: none; }
  .fly { opacity: 0; }
  .water, .ring .val, .btn { transition: none; }
}
</style>

3: {
  title: "What is destroying them", q: "If they are this useful, why are they disappearing?", time: "5 to 7 min",

    { title: "How much has been lost?", lead: "If they are this useful, why are they disappearing?",
      text: "Mangroves are disappearing, but the picture is mixed. From 1996 to 2020, the world had a net loss of 5,245 square kilometers of mangroves, about 2,025 square miles. That is about the size of Delaware, and 3.4 percent of the mangroves that existed in 1996. Net means the loss that is left after new growth is subtracted. These figures come from Global Mangrove Watch, which maps mangroves from satellite images.",

    { title: "Where the losses happened",
      text: "The losses were not spread evenly. Asia lost the most, about 1,086 square miles. Africa lost about 250 square miles, and the Pacific region about 202. Other regions lost the rest. The same report also estimates that about 3,160 square miles of lost mangroves could be restored. You will see in Module 4 what that depends on.",
      alt: "A bar chart of mangrove area lost from 1996 to 2020: Asia about 1,086 square miles, Africa about 250 and the Pacific about 202.", art: "regions" },
    { title: "What is behind the losses",
      text: "A global report from the Global Mangrove Alliance looked at the causes from 2000 to 2020. About 43 percent of the loss came from clearing mangroves for three uses: fish and shrimp ponds, oil palm plantations and rice fields. About 26 percent came from natural causes, such as shifting riverbeds, mud and sand piling up or washing away, and rising seas. The rest had other causes. The mix is changing. Ponds caused a smaller share in the 2010s than in the 2000s, while oil palm caused a larger one. The share from natural causes also grew, which the report links at least in part to climate change.",

    { title: "Good news can hide bad news",
      text: "A newer report, Global Mangrove Watch 4.1, covers about 40 years. It found a net global gain of about 184 square miles. That sounds like good news, but some countries lost a lot: Indonesia about 789 square miles, Myanmar about 563, Malaysia about 150 and Nigeria about 120. The gains were mostly near rivers and deltas. The report says human activity upstream may explain some of them, but it presents that as a possible explanation, not a proven one. It also credits planting, restoration and natural regrowth.",
      alt: "A bar chart with one short green bar for the world's net gain of about 184 square miles, and four longer orange bars for losses in Indonesia, Myanmar, Malaysia and Nigeria.", art: "balance" },

      alt: "Two bars of different lengths. A shorter orange bar for the 1996 to 2020 net loss and a longer green bar for the net gain over about 40 years, showing that they cover different spans of time.", art: "spans" },
    { title: "How to read a loss figure",
      text: "Before you trust or share a number about mangroves, ask three questions. What exactly is counted: total area, or net change after new growth? Which years does it cover? Which places does it include? A figure that answers all three is much easier to use, and much harder to misread.",

4: {
  title: "Restoration and the blue economy", q: "Can the damage be undone?", time: "5 to 7 min",

    { title: "Some forests can come back", lead: "Can the damage be undone?",
      text: "Module 3 showed that mangroves are being lost, but it also showed regrowth. Global Mangrove Watch counts about 3,160 square miles of lost mangroves as restorable, roughly one and a half times the size of Delaware. That is a map estimate. Whether a particular site can really recover depends on conditions on the ground, and on how the work is done. The next two screens show what goes wrong and what goes right.",

/* ---------- the coast scene (screen 2 of Module 1, and Module 4) ---------- */
function groundY(x) {
  return 238 + 84 * S3((x - 40) / 230) + 50 * S3((x - 270) / 350) + 100 * S3((x - 600) / 200);
}
function coastScene({ trees = true, overlay = "", labelled = true }) {
  const pts = [];
  for (let x = 0; x <= 800; x += 8) pts.push(`${x} ${groundY(x).toFixed(1)}`);
  const line = "M" + pts.join(" L");
  const land = x => { const y = groundY(x) - 2; return `<g><path d="M${x} ${y + 14} v-48" stroke="#6b4a33" stroke-width="7" stroke-linecap="round"/><circle cx="${x}" cy="${y - 52}" r="26" fill="url(#landG)"/><circle cx="${x - 18}" cy="${y - 40}" r="18" fill="url(#landG)"/><circle cx="${x + 10}" cy="${y - 62}" r="13" fill="#8fc27a" opacity=".55"/><circle cx="${x - 6}" cy="${y - 36}" r="10" fill="#2f6b3c" opacity=".35"/></g>`; };
  const mang = trees ? [322, 392, 462].map(x => U("mtree", x - 44, groundY(x) - 108, 88, 110)).join("") : "";
  const mudTop = [], mudBot = [];
  for (let x = 262; x <= 800; x += 8) { const y = groundY(x); mudTop.push(`${x} ${y.toFixed(1)}`); mudBot.unshift(`${x} ${(y + 18 * S3((x - 262) / 70)).toFixed(1)}`); }
  const mud = `M${mudTop.join(" L")} L${mudBot.join(" L")}Z`;
  const defs = `<radialGradient id="landG" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#6fb36a"/><stop offset="1" stop-color="#2f7a46"/></radialGradient><clipPath id="cclip"><path d="${line} L800 0 L0 0Z"/></clipPath>`;
  const names = labelled ? `${label(130, 104, "Land", { size: 28, fill: "var(--ink)" })}
    ${trees ? label(392, 192, "Mangrove forest", { size: 28, fill: "var(--ink)" }) : ""}
    ${label(790, 312, "High tide", { anchor: "end", size: 24, fill: "var(--ink)" })}
    ${label(790, 362, "Low tide", { anchor: "end", size: 24, fill: "var(--ink)" })}
    ${label(735, 428, "Sea", { size: 28, fill: "#fff" })}` : "";
  return svgWrap("csky", `
    ${sunSvg(700, 80, 34)}${flock([[38, .9, 30, 6], [62, .7, 38, 20]], 800)}
    ${land(70)}${land(150)}${land(225)}
    <path d="${line} L800 500 L0 500Z" fill="#8c7b5f"/>
    <path d="${mud}" fill="#6e5f4a"/>
    ${mang}
    <g clip-path="url(#cclip)">
      <rect x="0" y="322" width="800" height="200" fill="#3cb7ea" opacity=".42"/>
      <rect x="0" y="372" width="800" height="200" fill="#0054a5" opacity=".62"/>
      ${ripples([334, 358, 392], 800)}
    </g>
    <g stroke="#0a2342" stroke-width="2" stroke-dasharray="8 7" opacity=".7"><path d="M268 322 H800"/><path d="M598 372 H800"/></g>
    ${overlay}${names}`, defs);
}

function discs(items, o = {}) {
  const n = items.length;
  const wide = o.connect && n === 3;
  const xs = n === 4 ? [100, 300, 500, 700] : wide ? [130, 400, 670] : n === 3 ? [160, 400, 640] : [400];
  const r = n === 4 ? 84 : wide ? 84 : n === 3 ? 98 : 124, sc = n === 4 ? .84 : wide ? .86 : n === 3 ? 1 : 1.25;
  const ls = o.labelSize || (n === 4 ? 32 : n === 3 ? 34 : 42), cy = 205;
  const link = o.connect ? xs.slice(0, -1).map((x, i) => `<path d="M${x + r + 10} ${cy} H${xs[i + 1] - r - 10}" stroke="var(--ink)" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" class="flowline"/>`).join("") : "";
  const body = items.map((it, i) => {

}

      const legs = pts.filter((_, k) => k > 1 && k < N - 3 && k % 2).map(([x, y, ang]) => `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(Math.cos((ang + 55) * Math.PI / 180) * 11).toFixed(1)} ${(Math.sin((ang + 55) * Math.PI / 180) * 11).toFixed(1)}" stroke="${belly}" stroke-width="1.8" stroke-linecap="round"/>`).join("");
      const head = `<path d="M-33 8 C-36 -14 -22 -26 -8 -18 C-2 -8 -6 8 -16 14 C-24 16 -30 14 -33 8Z" fill="#f08f6c" stroke="${dark}" stroke-width="1"/><path d="M-33 6 L-52 -2 L-34 -3Z" fill="${dark}"/><path d="M-26 -12 C-20 -18 -12 -18 -9 -14" stroke="#ffd2bd" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;

      return `<g transform="scale(${sc})">${ant}${legs}<g transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)})">${fan}</g>${rings}${head}${eye}</g>`;
    };
    const defs = `
      <radialGradient id="chA" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#f6dcae"/><stop offset="1" stop-color="#d9b078"/></radialGradient>

/* Black mangrove (Avicennia): thin pencil roots rise from the mud, salt leaves out through the leaves. */
function blackMangrove(cx, gy) {
  const R = rng(11);
  const blobs = [[cx, gy - 190, 62], [cx - 58, gy - 165, 44], [cx + 58, gy - 165, 44], [cx - 20, gy - 228, 38], [cx + 28, gy - 222, 36]];
  let leaves = "", salt = "";
  for (let i = 0; i < 300; i++) {
    const [bx, by, r] = blobs[Math.floor(R() * blobs.length)], a = R() * 6.283, d = r * (.2 + .85 * Math.sqrt(R()));
    const x = bx + Math.cos(a) * d, y = by + Math.sin(a) * d * .85, lit = Math.max(0, Math.min(1, .5 + (by - y) * .006 + (R() - .5) * .5));
    const c = lit < .5 ? mix([70, 112, 76], [110, 150, 98], lit * 2) : mix([110, 150, 98], [168, 200, 140], (lit - .5) * 2);
    leaves += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(8 + R() * 5).toFixed(1)}" ry="${(2.6 + R() * 1.4).toFixed(1)}" transform="rotate(${Math.round(R() * 180)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="rgb(${c})"/>`;
  }
  for (let i = 0; i < 9; i++) { const [bx, by, r] = blobs[i % blobs.length], a = R() * 6.283, d = r * (.55 + .4 * R()); const x = bx + Math.cos(a) * d, y = by + Math.sin(a) * d * .8; salt += `<path class="twinkle" style="animation-delay:-${(R() * 2).toFixed(1)}s" d="M${x.toFixed(1)} ${(y - 6).toFixed(1)} l4 6 l-4 6 l-4 -6Z" fill="#fff" stroke="#9fb5c4" stroke-width=".8"/>`; }
  const base = blobs.map(([bx, by, r]) => `<circle cx="${bx}" cy="${by}" r="${r * .92}" fill="#4f7a55"/>`).join("");
  const trunk = `<path d="M${cx} ${gy + 6} C${cx - 6} ${gy - 60} ${cx + 4} ${gy - 100} ${cx - 2} ${gy - 140}" stroke="#4a3a2e" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M${cx - 2} ${gy - 130} C${cx - 30} ${gy - 150} ${cx - 44} ${gy - 160} ${cx - 56} ${gy - 168}" stroke="#4a3a2e" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M${cx - 2} ${gy - 130} C${cx + 30} ${gy - 150} ${cx + 44} ${gy - 160} ${cx + 56} ${gy - 168}" stroke="#4a3a2e" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  const g = () => (R() + R() + R() - 1.5) / 1.5;
  const pneu = Array.from({ length: 38 }, () => { const x = cx + g() * 150, h = 36 + R() * 26, tilt = (R() - .5) * 10; return `<g transform="rotate(${tilt.toFixed(1)} ${x.toFixed(1)} ${gy})"><rect x="${(x - 2).toFixed(1)}" y="${(gy - h).toFixed(1)}" width="4" height="${(h + 8).toFixed(1)}" rx="2" fill="#5a4635"/><rect x="${(x - 1).toFixed(1)}" y="${(gy - h + 2).toFixed(1)}" width="1.2" height="${(h - 4).toFixed(1)}" rx=".6" fill="#8a6c52" opacity=".7"/></g>`; }).join("");
  return { pneu, tree: `<g class="sway">${trunk}${base}${leaves}${salt}</g>` };
}

/* A detailed shrimp, facing left. cooked = the orange-pink of a cooked shrimp, otherwise a live pond shrimp. */
function shrimp2({ cooked = false, sc = 1, ants = true } = {}) {
  const P = cooked
    ? { g: "url(#shC)", edge: "#8e311c", tail: "#d8452a", tailHi: "#f39a6b", belly: "#fde1c4", leg: "#f0966c", ant: "#d9663f", dark: "#a93a22" }
    : { g: "url(#shR)", edge: "#76594a", tail: "#c98e86", tailHi: "#ecc8bc", belly: "#f8ebe0", leg: "#d2b39d", ant: "#b8987f", dark: "#9a6f5c" };
  const bz = (p, u) => { const m = 1 - u; return [m*m*m*p[0][0] + 3*m*m*u*p[1][0] + 3*m*u*u*p[2][0] + u*u*u*p[3][0], m*m*m*p[0][1] + 3*m*m*u*p[1][1] + 3*m*u*u*p[2][1] + u*u*u*p[3][1]]; };
  const A = [[-8, -6], [-8, -34], [28, -38], [40, -8]], B = [[40, -8], [46, 10], [38, 28], [18, 34]];
  const at = t => { const seg = t <= 1 ? A : B, u = t <= 1 ? t : t - 1, [x, y] = bz(seg, u), [x2, y2] = bz(seg, Math.min(1, u + .02)), [x1, y1] = bz(seg, Math.max(0, u - .02)); const l = Math.hypot(x2 - x1, y2 - y1) || 1; return { x, y, tx: (x2 - x1) / l, ty: (y2 - y1) / l }; };
  const th = t => 19 - 10.5 * (t / 2);
  const dors = [], vent = [];
  for (let k = 0; k <= 40; k++) { const t = k / 20, p = at(t), nx = -p.ty, ny = p.tx, r = th(t); dors.push([p.x - nx * r, p.y - ny * r]); vent.push([p.x + nx * r * .92, p.y + ny * r * .92]); }
  const poly = pts => pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const body = `<path d="${poly(dors)} ${poly(vent.slice().reverse()).replace("M", "L")}Z" fill="${P.g}" stroke="${P.edge}" stroke-width="1.1" stroke-linejoin="round"/>`;
  const ventBand = `<path d="${poly(vent.map(([x, y], i) => { const p = at(i / 20), r = th(i / 20) * .45; return [x - (-p.ty) * r, y - p.tx * r]; }))}" stroke="${P.belly}" stroke-opacity=".7" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const dorsHi = `<path d="${poly(dors.map(([x, y], i) => { const p = at(i / 20), r = th(i / 20) * .3; return [x + (-p.ty) * r, y + p.tx * r]; }))}" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const seg = [.28, .56, .84, 1.12, 1.4, 1.68].map(tt => { const p = at(tt), nx = -p.ty, ny = p.tx, r = th(tt); const x1 = p.x - nx * r, y1 = p.y - ny * r, x2 = p.x + nx * r * .92, y2 = p.y + ny * r * .92; return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${(p.x - p.tx * 3).toFixed(1)} ${(p.y - p.ty * 3).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${P.edge}" stroke-opacity=".7" stroke-width="1.2" fill="none"/><path d="M${(x1 + p.tx * 6).toFixed(1)} ${(y1 + p.ty * 6).toFixed(1)} Q${(p.x + p.tx * 3).toFixed(1)} ${(p.y + p.ty * 3).toFixed(1)} ${(x2 + p.tx * 6).toFixed(1)} ${(y2 + p.ty * 6).toFixed(1)}" stroke="#fff" stroke-opacity=".22" stroke-width="1.4" fill="none"/>`; }).join("");
  const pleo = [.2, .5, .8, 1.1, 1.4].map(tt => { const p = at(tt), nx = -p.ty, ny = p.tx, r = th(tt) * .92; const x = p.x + nx * r, y = p.y + ny * r; return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="2.4" ry="7.5" transform="rotate(${(Math.atan2(ny, nx) * 180 / Math.PI - 90 + 15).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${P.tailHi}" stroke="${P.edge}" stroke-width=".6"/>`; }).join("");
  const e = at(2), ang = Math.atan2(e.ty, e.tx) * 180 / Math.PI;
  const fan = [-38, -16, 16, 38].map(d => `<path d="M0 0 C-5 9 -6 20 ${(d / 3).toFixed(1)} 26 C${(d / 3 + 7).toFixed(1)} 18 6 7 0 0Z" transform="rotate(${(ang - 90 + d).toFixed(0)})" fill="${P.tail}" stroke="${P.edge}" stroke-width=".8"/>`).join("");
  const telson = `<path d="M-4 0 L0 24 L4 0Z" transform="rotate(${(ang - 90).toFixed(0)})" fill="${P.tailHi}" stroke="${P.edge}" stroke-width=".8"/>`;
  const carapace = `<path d="M-52 10 C-58 -14 -36 -36 -10 -32 C8 -28 14 -2 2 16 C-10 28 -44 28 -52 10Z" fill="${P.g}" stroke="${P.edge}" stroke-width="1.1"/>
    <path d="M-50 -2 C-46 -22 -28 -30 -14 -26" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-30 -26 C-20 -14 -18 4 -26 20" stroke="${P.edge}" stroke-opacity=".5" stroke-width="1.2" fill="none"/>
    <path d="M-52 8 C-42 24 -16 26 0 14" stroke="${P.belly}" stroke-opacity=".7" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
  const rostrum = `<path d="M-52 -8 L-86 -28 L-76 -22 L-80 -16 L-66 -14 L-70 -8Z" fill="${P.g}" stroke="${P.edge}" stroke-width=".9" stroke-linejoin="round"/>`;
  const eye = `<ellipse cx="-45" cy="-9" rx="5.6" ry="6.2" fill="#111118"/><ellipse cx="-46.8" cy="-11" rx="1.8" ry="2.2" fill="#fff"/>`;
  const ant = `<g fill="none" stroke="${P.ant}" stroke-linecap="round"><path d="M-50 -3 C-80 -30 -120 -26 -152 -58" stroke-width="1.6"/><path d="M-52 2 C-86 8 -124 20 -158 10" stroke-width="1.4"/><path d="M-50 -5 C-68 -14 -84 -12 -98 -24" stroke-width="1.2"/></g>`;
  const legs = [-46, -36, -26, -16, -6].map((x, i) => `<path d="M${x} 18 q${-4 - i % 2 * 2} 9 ${-10 + i} 15" stroke="${P.leg}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`).join("");
  return `<g transform="scale(${sc})">${ants ? ant : ""}${legs}<g transform="translate(${e.x.toFixed(1)} ${e.y.toFixed(1)})">${telson}${fan}</g>${pleo}${body}${ventBand}${seg}${dorsHi}${carapace}${rostrum}${eye}</g>`;
}

/* a standing child who can wave */
function kid(x, y, girl, o = {}) {
  const skin = o.skin || "#e3a97c", hair = o.hair || "#2b2a33", top = o.top, bottom = o.bottom;

  const body = girl
    ? `<path d="M${x - 15} ${y - 74} h30 l10 46 h-50Z" fill="${top}"/>`
    : `<rect x="${x - 15}" y="${y - 74}" width="30" height="42" rx="6" fill="${top}"/><rect x="${x - 15}" y="${y - 40}" width="30" height="12" fill="${bottom}"/>`;
  const armDown = `<path d="M${x - 15} ${y - 68} l-9 28" stroke="${skin}" stroke-width="7" stroke-linecap="round"/>`;
  const armUp = `<g class="waving" style="transform-origin:${x + 15}px ${y - 68}px"><path d="M${x + 15} ${y - 68} l14 -26" stroke="${skin}" stroke-width="7" stroke-linecap="round"/><circle cx="${x + 30}" cy="${y - 98}" r="6.5" fill="${skin}"/></g>`;
  const head = `<circle cx="${x}" cy="${y - 92}" r="17" fill="${skin}"/>` + (girl

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function makeQuiz(m) {
  const Q = MODS[m].questions;
  return { order: Q.map(q => shuffle(q.options.map((_, i) => i))), answers: Q.map(() => ({ sel: null, checked: false })) };
}

window.addEventListener("popstate", e => { if (e.state) { Object.assign(state, e.state); render(); } });

const TERM_KEYS = Object.keys(DEFS).sort((a, b) => b.length - a.length);
const TERM_RE = new RegExp("\\b(" + TERM_KEYS.map(k => k.replace(/ /g, "\\s")).join("|") + ")(s|es)?\\b", "gi");
function bodyHTML(t) {
  const seen = new Set();
  return esc(t).replace(TERM_RE, (m, k) => {
    const key = k.toLowerCase().replace(/\s+/g, " ");
    if (seen.has(key)) return m;
    seen.add(key);
    return `<button type="button" class="term" data-term="${key}">${m}</button>`;
  });
}

function gauge({ total, level, current, jump, marks }) {
  const lis = Array.from({ length: total }, (_, i) => {
    const m = marks ? marks[i] : "";
    const cls = [i <= (current ?? -1) || m ? "on" : "", i === current ? "now" : "", m].filter(Boolean).join(" ");
    const inner = jump
      ? `<button type="button" data-goto="${i}" aria-label="Screen ${i + 1}"${i === current ? ' aria-current="step"' : ""}>${i + 1}</button>`
      : `<span aria-label="Question ${i + 1}${m === "right" ? ", correct" : m === "wrong" ? ", not correct" : ""}">${i + 1}</span>`;
    return `<li class="${cls}">${inner}</li>`;
  }).join("");
  return `<div class="gauge" data-level="${level}" style="--p:${shownLevel}"><div class="tube" aria-hidden="true"><div class="water"></div></div><ol class="ticks">${lis}</ol></div>`;
}
function raiseGauge() {
  const g = app.querySelector(".gauge"); if (!g) { shownLevel = 0; return; }
  const target = Number(g.dataset.level);
  requestAnimationFrame(() => requestAnimationFrame(() => { g.style.setProperty("--p", target); shownLevel = target; }));
}

function renderQuiz() {
  const m = MOD(), QS = m.questions, SC = m.screens, Z = QZ();
  const i = state.q, Q = QS[i], a = Z.answers[i], n = QS.length;
  topstep.textContent = `Module ${state.mod}, question ${i + 1} of ${n}`;
  const marks = Z.answers.map((x, k) => x.checked ? (x.sel === QS[k].correct ? "right" : "wrong") : "");
  const answered = marks.filter(Boolean).length;
  const opts = Z.order[i].map((orig, pos) => {
    const id = `q${i}o${pos}`;
    let cls = "opt", tag = "";
    if (a.checked) {
      if (orig === Q.correct) { cls += " correct"; tag = `<span class="tag">Correct answer</span>`; }
      else if (a.sel === orig) { cls += " wrong"; tag = `<span class="tag">Your answer</span>`; }
    }
    return `<div class="${cls}"><input type="radio" name="q${i}" id="${id}" value="${orig}" ${a.sel === orig ? "checked" : ""} ${a.checked ? "disabled" : ""}><label for="${id}"><span class="ltr" aria-hidden="true">${"ABCD"[pos]}</span><span>${tag}${esc(Q.options[orig])}</span></label></div>`;
  }).join("");
  let fb = "";
  if (a.checked) {
    const ok = a.sel === Q.correct;
    fb = `<div class="feedback ${ok ? "good" : "bad"}" role="status"><strong>${ok ? "Correct." : "Not quite."}</strong><p>${esc(Q.why)}</p>${ok ? "" : `<p><button class="linkbtn" data-act="review">Review screen ${Q.review}: ${esc(SC[Q.review - 1].title)}</button></p>`}</div>`;
  }
  const lastQ = i === n - 1;
  app.innerHTML = `<div class="wrap stage">
    <nav class="crumb" aria-label="Breadcrumb"><button class="linkbtn" data-act="home">All modules</button><span aria-hidden="true">/</span><span>Module ${state.mod}: Practice quiz</span></nav>
    <div class="grid">
      ${gauge({ total: n, level: answered / n, current: i, marks })}
      <article class="main">
        <h2 id="view-heading" class="qcount">Question ${i + 1} of ${n}</h2>
        <fieldset><legend>${esc(Q.q)}</legend>${opts}</fieldset>
        ${fb}
        <div class="nav">${a.checked
          ? `<button class="btn" data-act="advance">${lastQ ? "See my result" : "Next question"}</button>`
          : `<button class="btn" data-act="check" ${a.sel === null ? "disabled" : ""}>Check answer</button>`}<button class="btn ghost" data-act="skipquiz">${state.mod < COUNT ? `Skip the quiz, go to Module ${state.mod + 1}` : "Skip the quiz, back to all modules"}</button></div>
      </article>
    </div></div>`;
}

function renderResult() {

  const marks = Z.answers.map((x, k) => x.sel === QS[k].correct ? "right" : "wrong");
  const right = marks.filter(v => v === "right").length;
  const C = 2 * Math.PI * 62;
  const msg = right === n ? m.win
    : right >= 3 ? "Good work. Look over the screens you missed, then retake the quiz if you like."
    : "This takes a little getting used to. Review the lesson, then try the quiz again.";
  const list = QS.map((Q, k) => `<li><span class="mk ${marks[k]}" aria-hidden="true">${marks[k] === "right" ? "&#10003;" : "&#10007;"}</span><span>${esc(Q.q)}<span class="sr">${marks[k] === "right" ? " Correct." : " Not correct."}</span></span>${marks[k] === "wrong" ? `<button class="linkbtn" data-review="${Q.review}">Screen ${Q.review}</button>` : "<span></span>"}</li>`).join("");
  const more = state.mod < COUNT;
  app.innerHTML = `<div class="wrap stage">
    <nav class="crumb" aria-label="Breadcrumb"><button class="linkbtn" data-act="home">All modules</button><span aria-hidden="true">/</span><span>Module ${state.mod}: Result</span></nav>
    <div class="grid">
      ${gauge({ total: n, level: 1, current: null, marks })}
      <article class="main">
        <div class="score">
          <svg class="ring" viewBox="0 0 140 140" role="img" aria-label="${right} out of ${n} correct"><circle class="track" cx="70" cy="70" r="62"/><circle class="val" cx="70" cy="70" r="62" stroke-dasharray="0 ${C}" data-to="${(right / n) * C}"/><text x="70" y="78" text-anchor="middle">${right}</text><text class="of" x="70" y="100" text-anchor="middle">of ${n}</text></svg>
          <div><h2 class="result-h" id="view-heading">Module ${state.mod} complete</h2><p class="result-p">${esc(msg)}</p></div>
        </div>
        <ul class="review">${list}</ul>
        <div class="nav">${more ? `<button class="btn" data-act="nextmod">Continue to Module ${state.mod + 1}</button>` : ""}<button class="btn ${more ? "ghost" : ""}" data-act="home">Back to all modules</button><button class="btn ghost" data-act="retake">Retake the quiz</button></div>
      </article>
    </div></div>`;
  const v = app.querySelector(".ring .val");
  requestAnimationFrame(() => requestAnimationFrame(() => v.setAttribute("stroke-dasharray", `${v.dataset.to} ${C}`)));
}

function renderReviewAll() {
  topstep.textContent = "Reviewer view";
  const mods = Object.keys(MODS).map(Number);
  const jump = mods.map(n => `<a href="#rm${n}">Module ${n}</a>`).join("");
  const body = mods.map(n => {
    const m = MODS[n];
    const screens = m.screens.map((s, i) => `<article class="rv-screen">
        <div class="rv-art" role="img" aria-label="${esc(s.alt)}">${ART[s.art]()}</div>
        <div><h4><span>${n}.${i + 1}</span> ${esc(s.title)}</h4>
          ${s.lead ? `<p class="rv-lead">${esc(s.lead)}</p>` : ""}
          <p>${esc(s.text)}</p>
          ${(s.chips || s.badges) ? (s.tips ? `<div class="rv-meta"><b>Labels under the picture, with the text shown on hover:</b><ul class="rv-tips">${(s.chips || s.badges).map((c, i) => `<li><b>${esc(c)}.</b> ${esc(s.tips[i])}</li>`).join("")}</ul></div>` : `<p class="rv-meta"><b>Labels under the picture:</b> ${(s.chips || s.badges).map(esc).join("; ")}</p>`) : ""}
          ${s.link ? `<p class="rv-meta"><b>Link:</b> ${esc(s.link.text)}, ${esc(s.link.url)}</p>` : ""}
          <p class="rv-meta"><b>Picture description:</b> ${esc(s.alt)}</p></div></article>`).join("");
    const qs = m.questions.map((Q, k) => `<li class="rv-q"><p class="rv-qtext">${esc(Q.q)}</p>
        <ol type="A">${Q.options.map((o, j) => `<li class="${j === Q.correct ? "ok" : ""}">${esc(o)}${j === Q.correct ? ' <b>Correct</b>' : ""}</li>`).join("")}</ol>
        <p class="rv-meta"><b>Why:</b> ${esc(Q.why)} <b>Sends the learner back to:</b> screen ${Q.review}.</p></li>`).join("");
    return `<section class="rv-mod" id="rm${n}"><h3>Module ${n}: ${esc(m.title)}</h3><p class="rv-meta">${esc(m.q)} Time: ${m.time}.${m.deeper ? ` Go deeper link: ${esc(m.deeper.text)}, ${esc(m.deeper.url)}.` : ""}</p>
      <h4 class="rv-sub">Lesson screens (${m.screens.length})</h4>${screens}
      <h4 class="rv-sub">Practice quiz (${m.questions.length} questions)</h4><ol class="rv-qs">${qs}</ol></section>`;
  }).join("");
  const nScreens = mods.reduce((a, n) => a + MODS[n].screens.length, 0), nQ = mods.reduce((a, n) => a + MODS[n].questions.length, 0);
  app.innerHTML = `<div class="wrap stage rv">
    <nav class="crumb" aria-label="Breadcrumb"><button class="linkbtn" data-act="home">All modules</button><span aria-hidden="true">/</span><span>Reviewer view</span></nav>
    <h2 class="lesson-title" id="view-heading">All course content</h2>
    <p class="lead-q">${nScreens} lesson screens and ${nQ} quiz questions, with correct answers marked. Nothing here is hidden behind a quiz or a lesson order.</p>
    <p class="rv-meta"><button class="btn ghost sm" onclick="window.print()">Print or save as PDF</button></p>
    <nav class="rv-jump" aria-label="Jump to a module">${jump}</nav>${body}</div>`;
}

function render() {
  if (typeof hideTip === "function") hideTip();
  ({ home: renderHome, lesson: renderLesson, quiz: renderQuiz, result: renderResult, review: renderReviewAll })[state.view]();
  raiseGauge();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) app.querySelectorAll("svg").forEach(v => v.pauseAnimations && v.pauseAnimations());
  if (state.view !== "home") { const h = document.getElementById("view-heading"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-goto],[data-term],[data-review]"); if (!t) return;
  if (t.dataset.term) {
    const d = document.getElementById("def"), k = t.dataset.term;
    d.innerHTML = d.dataset.k === k ? "" : `<strong>${k[0].toUpperCase() + k.slice(1)}:</strong> ${DEFS[k]}`;
    d.dataset.k = d.dataset.k === k ? "" : k; return;
  }
  if (t.dataset.goto !== undefined) return go({ screen: Number(t.dataset.goto) });
  if (t.dataset.review) return go({ view: "lesson", screen: Number(t.dataset.review) - 1, back: false });
  switch (t.dataset.act) {
    case "home": return go({ view: "home", back: false });
    case "review-all": return go({ view: "review", back: false });
    case "start": { const n = Number(t.dataset.mod || 1); delete state.quizzes[n]; return go({ view: "lesson", mod: n, screen: 0, back: false }); }
    case "nextmod": { const n = state.mod + 1; delete state.quizzes[n]; return go({ view: "lesson", mod: n, screen: 0, back: false }); }
    case "next": return state.screen === MOD().screens.length - 1 ? go({ view: "quiz", q: 0 }) : go({ screen: state.screen + 1 });
    case "prev": return go({ screen: state.screen - 1 });
    case "skipquiz": { if (state.mod < COUNT) { const n = state.mod + 1; delete state.quizzes[n]; return go({ view: "lesson", mod: n, screen: 0, back: false }); } return go({ view: "home", back: false }); }
    case "backquiz": return go({ view: "quiz", back: false });
    case "review": return go({ view: "lesson", screen: MOD().questions[state.q].review - 1, back: true });
    case "check": { QZ().answers[state.q].checked = true; render(); const f = document.querySelector(".feedback"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
    case "advance": if (state.q === MOD().questions.length - 1) { state.done[state.mod] = true; return go({ view: "result" }); } return go({ q: state.q + 1 });
    case "retake": { state.quizzes[state.mod] = makeQuiz(state.mod); return go({ view: "quiz", q: 0 }); }
  }
});
document.addEventListener("change", e => {
  if (e.target.matches(".opt input")) { QZ().answers[state.q].sel = Number(e.target.value); const c = document.querySelector('[data-act="check"]'); if (c) c.disabled = false; }
});
document.addEventListener("keydown", e => {
  if (state.view !== "lesson" || state.back || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = MOD().screens.length;
  if (e.key === "ArrowRight" && state.screen < n - 1) go({ screen: state.screen + 1 });
  if (e.key === "ArrowLeft" && state.screen > 0) go({ screen: state.screen - 1 });
});

if (location.hash === "#review") state.view = "review";
render();

/* ---------- Hover text for the labels under pictures ---------- */
var tipEl = document.getElementById("tip"), tipFor = null, tipPinned = false;
function showTip(btn, pin) {
  tipFor = btn; tipPinned = !!pin; tipEl.textContent = btn.dataset.tip; tipEl.hidden = false; tipEl.style.visibility = "hidden";
  const r = btn.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight, m = 12;
  const left = Math.max(m, Math.min(r.left, window.innerWidth - tw - m));
  const below = r.bottom + 10, top = below + th > window.innerHeight - m ? Math.max(m, r.top - th - 10) : below;
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px"; tipEl.style.visibility = "visible";
  document.querySelectorAll(".chip[aria-expanded], .hot[aria-expanded]").forEach(c => c.removeAttribute("aria-expanded"));
  btn.setAttribute("aria-expanded", "true");
}
function hideTip() { if (tipEl && !tipEl.hidden) { tipEl.hidden = true; if (tipFor) tipFor.removeAttribute("aria-expanded"); tipFor = null; tipPinned = false; } }
document.addEventListener("mouseover", e => { const b = e.target.closest(".chip, .hot[data-tip]"); if (b && !tipPinned) showTip(b, false); });
document.addEventListener("mouseout", e => { const b = e.target.closest(".chip, .hot[data-tip]"); if (b && !tipPinned && !b.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("focusin", e => { const b = e.target.closest(".chip, .hot[data-tip]"); if (b) showTip(b, false); });
document.addEventListener("focusout", e => { if (e.target.closest(".chip, .hot[data-tip]") && !tipPinned) hideTip(); });
document.addEventListener("click", e => {
  const b = e.target.closest(".chip, .hot[data-tip]");
  if (b) { if (tipFor === b && tipPinned) hideTip(); else showTip(b, true); return; }
  hideTip();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); const h = e.target.closest && e.target.closest(".hot[data-tip]"); if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (tipFor === h && tipPinned) hideTip(); else showTip(h, true); } });
window.addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("resize", hideTip);

</script>
</body>
</html>
